name = "casino"
main = "src/worker.js"
compatibility_date = "2024-09-23"
preview_urls = false

# ─── CRON TRIGGERS ───────────────────────────────────────────────
# Weekly schedule aligned to Mom's Casino Bus nights:
#   Thursday  12:00 PM CT (18:00 UTC) — pre-deploy for Thu night
#   Friday    12:00 PM CT (18:00 UTC) — pre-deploy for Fri night
#   Saturday  12:00 PM CT (18:00 UTC) — pre-deploy for Sat night
[triggers]
crons = [
  "0 18 * * 4",
  "0 18 * * 5",
  "0 18 * * 6"
]

# ─── OBSERVABILITY ───────────────────────────────────────────────
[observability]
enabled = true
