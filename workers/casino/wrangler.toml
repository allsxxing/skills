name = "casino"
main = "src/worker.js"
compatibility_date = "2024-09-23"
preview_urls = false

# ─── CRON TRIGGERS ───────────────────────────────────────────────
# Weekly schedule aligned to Mom's Casino Bus nights:
#   Thursday  12:00 PM CT (18:00 UTC) — pre-deploy for Thu night
#   Friday    12:00 PM CT (18:00 UTC) — pre-deploy for Fri night
#   Saturday  12:00 PM CT (18:00 UTC) — pre-deploy for Sat night
[triggers]
# Cloudflare numbers weekdays 1 = Sunday through 7 = Saturday, so 4,5,6 fired Wed/Thu/Fri.
# Day names are unambiguous.
crons = [
  "0 18 * * THU",
  "0 18 * * FRI",
  "0 18 * * SAT"
]

# ─── OBSERVABILITY ───────────────────────────────────────────────
[observability]
enabled = true
